application:
  name: RetailPulse Analytics
  version: "1.0.0"
  environment: DEV

data:
  raw_path: data/raw
  bronze_path: data/bronze
  silver_path: data/silver
  gold_path: data/gold
  generated_path: data/generated

pipeline:
  batch_size: 1000
  max_retries: 3

logging:
  level: INFO
  file: logs/retailpulse.log
  console: true

snowflake:
  account: your_account
  user: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  warehouse: ''
  database: ''
  schema: ''
  role: ''